<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chapter 1 — visual 1: model class decision tree</title>
<style>
  body{margin:0;background:#ffffff;display:flex;justify-content:center;padding:32px 16px;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;}
  .card{max-width:760px;width:100%;}
</style>
</head>
<body>
<div class="card">
<svg width="100%" viewBox="0 0 680 360" role="img">
<title>Decision tree: the type of the response variable picks the model class</title>
<desc>A flowchart showing that continuous y leads to the linear model, binary y leads to logit or probit, count y leads to Poisson, and ordered categorical y leads to ordinal models, with only the first two being in scope for this course.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="240" y="40" width="200" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="66" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">y = f(x) + &#949;</text>
<text x="340" y="84" text-anchor="middle" font-size="11" fill="#534AB7">the type of y decides everything</text>
<line x1="330" y1="100" x2="130" y2="205" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="335" y1="100" x2="270" y2="205" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="345" y1="100" x2="410" y2="205" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="100" x2="550" y2="205" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="47" y="210" width="135" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="114" y="232" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">continuous</text>
<text x="114" y="250" text-anchor="middle" font-size="11" fill="#0F6E56">linear model</text>
<text x="114" y="266" text-anchor="middle" font-size="11" fill="#0F6E56">(chapter 3)</text>
<rect x="197" y="210" width="135" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="264" y="232" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">binary 0/1</text>
<text x="264" y="250" text-anchor="middle" font-size="11" fill="#0F6E56">logit / probit</text>
<text x="264" y="266" text-anchor="middle" font-size="11" fill="#0F6E56">(chapter 2.3)</text>
<rect x="347" y="210" width="135" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="414" y="232" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">count</text>
<text x="414" y="250" text-anchor="middle" font-size="11" fill="#5F5E5A">poisson</text>
<text x="414" y="266" text-anchor="middle" font-size="11" fill="#5F5E5A">(not in scope)</text>
<rect x="497" y="210" width="135" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="564" y="232" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">ordered</text>
<text x="564" y="250" text-anchor="middle" font-size="11" fill="#5F5E5A">ordinal</text>
<text x="564" y="266" text-anchor="middle" font-size="11" fill="#5F5E5A">(not in scope)</text>
<text x="340" y="320" text-anchor="middle" font-size="11" fill="#5F5E5A">only the response variable's type decides the model class</text>
<text x="340" y="338" text-anchor="middle" font-size="11" fill="#5F5E5A">covariates are just ingredients — chop them into dummies and pour them in</text>
</svg>
</div>
</body>
</html>
