<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chapter 1 — visual 3: the four scatter plot questions</title>
<style>
  body{margin:0;background:#ffffff;display:flex;justify-content:center;padding:32px 16px;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;}
  .card{max-width:760px;width:100%;}
</style>
</head>
<body>
<div class="card">
<svg width="100%" viewBox="0 0 680 460" role="img">
<title>The four scatter plot questions, later reused as residual plots</title>
<desc>A scatter plot illustrating four diagnostic questions: is there a trend, is it straight, is the spread constant, and are there outliers. A legend maps four numbered badges to these questions, with a note that the same four questions reappear as residual plots in section 3.4.4.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="70" y="60" width="540" height="280" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="110" y1="320" x2="590" y2="320" stroke="#888780" stroke-width="0.5"/>
<line x1="110" y1="80" x2="110" y2="320" stroke="#888780" stroke-width="0.5"/>
<line x1="110" y1="300" x2="560" y2="120" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<g fill="#7F77DD">
<circle cx="130" cy="300" r="3"/><circle cx="160" cy="288" r="3"/><circle cx="190" cy="270" r="3"/>
<circle cx="220" cy="255" r="3"/><circle cx="250" cy="235" r="3"/><circle cx="280" cy="225" r="3"/>
<circle cx="320" cy="205" r="3"/><circle cx="360" cy="180" r="3"/><circle cx="400" cy="165" r="3"/>
<circle cx="440" cy="150" r="3"/><circle cx="480" cy="130" r="3"/><circle cx="520" cy="140" r="3"/>
<circle cx="560" cy="110" r="3"/>
</g>
<circle cx="270" cy="140" r="4" fill="#D85A30"/>
<circle cx="565" cy="105" r="9" fill="none" stroke="#7F77DD" stroke-width="1"/>
<text x="565" y="109" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">1</text>
<circle cx="285" cy="215" r="9" fill="none" stroke="#7F77DD" stroke-width="1"/>
<text x="285" y="219" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">2</text>
<circle cx="505" cy="155" r="9" fill="none" stroke="#7F77DD" stroke-width="1"/>
<text x="505" y="159" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">3</text>
<circle cx="285" cy="125" r="9" fill="none" stroke="#D85A30" stroke-width="1"/>
<text x="285" y="129" text-anchor="middle" font-size="11" font-weight="500" fill="#712B13">4</text>
<circle cx="60" cy="380" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="384" text-anchor="middle" font-size="11" fill="#3C3489">1</text>
<text x="80" y="384" font-size="12" fill="#2C2C2A">is there a trend?</text>
<circle cx="360" cy="380" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="360" y="384" text-anchor="middle" font-size="11" fill="#3C3489">2</text>
<text x="380" y="384" font-size="12" fill="#2C2C2A">is it straight?</text>
<circle cx="60" cy="410" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="414" text-anchor="middle" font-size="11" fill="#3C3489">3</text>
<text x="80" y="414" font-size="12" fill="#2C2C2A">is the spread constant?</text>
<circle cx="360" cy="410" r="9" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="360" y="414" text-anchor="middle" font-size="11" fill="#712B13">4</text>
<text x="380" y="414" font-size="12" fill="#2C2C2A">any outliers?</text>
<text x="340" y="445" text-anchor="middle" font-size="11" fill="#5F5E5A">the same four questions reappear as residual plots in section 3.4.4</text>
</svg>
</div>
</body>
</html>
