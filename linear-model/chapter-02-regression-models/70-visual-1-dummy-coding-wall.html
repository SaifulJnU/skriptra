<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chapter 2 — visual 1: dummy variable coding</title>
<style>
  body{margin:0;background:#ffffff;display:flex;justify-content:center;padding:32px 16px;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;}
  .card{max-width:760px;width:100%;}
</style>
</head>
<body>
<div class="card">
<svg width="100%" viewBox="0 0 680 400" role="img">
<title>Dummy variable coding: five education levels measured against one reference</title>
<desc>A vertical scale showing the wage premium for five education levels relative to the reference category, less than high school, which sits at zero and needs no coefficient. The other four levels are shown as increasing offsets from the reference, using the Sheet 1 coefficients.</desc>
<text x="70" y="50" font-size="11" fill="#5F5E5A">$ / hour premium</text>
<line x1="150" y1="60" x2="150" y2="390" stroke="#5F5E5A" stroke-width="1"/>
<line x1="144" y1="380" x2="156" y2="380" stroke="#5F5E5A" stroke-width="1"/>
<line x1="144" y1="83" x2="156" y2="83" stroke="#5F5E5A" stroke-width="1"/>
<line x1="150" y1="380" x2="200" y2="380" stroke="#854F0B" stroke-width="1" stroke-dasharray="2,2"/>
<circle cx="150" cy="380" r="4" fill="#EF9F27"/>
<rect x="210" y="360" width="330" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="225" y="376" font-size="12" font-weight="500" fill="#633806">&lt; HS grad — the reference</text>
<text x="225" y="392" font-size="11" fill="#854F0B">$0 — needs no coefficient (it IS the mark)</text>
<line x1="150" y1="328" x2="200" y2="328" stroke="#0F6E56" stroke-width="1" stroke-dasharray="2,2"/>
<circle cx="150" cy="328" r="4" fill="#1D9E75"/>
<rect x="210" y="308" width="330" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="225" y="324" font-size="12" font-weight="500" fill="#085041">HS grad</text>
<text x="225" y="340" font-size="11" fill="#0F6E56">+$11.44 vs the reference</text>
<line x1="150" y1="270" x2="200" y2="270" stroke="#0F6E56" stroke-width="1" stroke-dasharray="2,2"/>
<circle cx="150" cy="270" r="4" fill="#1D9E75"/>
<rect x="210" y="250" width="330" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="225" y="266" font-size="12" font-weight="500" fill="#085041">some college</text>
<text x="225" y="282" font-size="11" fill="#0F6E56">+$24.17 vs the reference</text>
<line x1="150" y1="198" x2="200" y2="198" stroke="#0F6E56" stroke-width="1" stroke-dasharray="2,2"/>
<circle cx="150" cy="198" r="4" fill="#1D9E75"/>
<rect x="210" y="178" width="330" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="225" y="194" font-size="12" font-weight="500" fill="#085041">college grad</text>
<text x="225" y="210" font-size="11" fill="#0F6E56">+$39.77 vs the reference</text>
<line x1="150" y1="83" x2="200" y2="83" stroke="#0F6E56" stroke-width="1" stroke-dasharray="2,2"/>
<circle cx="150" cy="83" r="4" fill="#1D9E75"/>
<rect x="210" y="63" width="330" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="225" y="79" font-size="12" font-weight="500" fill="#085041">advanced degree</text>
<text x="225" y="95" font-size="11" fill="#0F6E56">+$64.99 vs the reference</text>
</svg>
</div>
</body>
</html>
