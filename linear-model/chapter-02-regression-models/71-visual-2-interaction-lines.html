<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chapter 2 — visual 2: interaction lines</title>
<style>
  body{margin:0;background:#ffffff;display:flex;justify-content:center;padding:32px 16px;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;}
  .card{max-width:760px;width:100%;}
</style>
</head>
<body>
<div class="card">
<svg width="100%" viewBox="0 0 680 340" role="img">
<title>Interaction terms make regression lines non-parallel</title>
<desc>Two mini charts of wage against age. The left chart, without an interaction term, shows two parallel lines with a constant gap. The right chart, with an interaction term, shows two lines with different slopes that diverge and are not parallel.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="200" y="55" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">no interaction — parallel</text>
<rect x="70" y="70" width="260" height="230" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="90" y1="280" x2="310" y2="280" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="90" y1="280" x2="90" y2="90" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="200" y="298" text-anchor="middle" font-size="11" fill="#5F5E5A">age</text>
<line x1="90" y1="260" x2="300" y2="150" stroke="#0F6E56" stroke-width="2"/>
<line x1="90" y1="220" x2="300" y2="110" stroke="#993C1D" stroke-width="2"/>
<text x="305" y="153" font-size="11" fill="#0F6E56">less good</text>
<text x="305" y="113" font-size="11" fill="#993C1D">very good</text>
<text x="200" y="322" text-anchor="middle" font-size="11" fill="#5F5E5A">gap between lines never changes</text>
<text x="480" y="55" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">with interaction — not parallel</text>
<rect x="350" y="70" width="260" height="230" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="370" y1="280" x2="590" y2="280" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="370" y1="280" x2="370" y2="90" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="480" y="298" text-anchor="middle" font-size="11" fill="#5F5E5A">age</text>
<line x1="370" y1="260" x2="580" y2="150" stroke="#0F6E56" stroke-width="2"/>
<line x1="370" y1="230" x2="580" y2="90" stroke="#993C1D" stroke-width="2"/>
<text x="585" y="153" font-size="11" fill="#0F6E56">less good</text>
<text x="585" y="93" font-size="11" fill="#993C1D">very good</text>
<text x="480" y="322" text-anchor="middle" font-size="11" fill="#5F5E5A">gap widens with age — the lines diverge</text>
</svg>
</div>
</body>
</html>
