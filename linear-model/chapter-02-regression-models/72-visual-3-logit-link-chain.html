<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chapter 2 — visual 3: the logit link chain</title>
<style>
  body{margin:0;background:#ffffff;display:flex;justify-content:center;padding:32px 16px;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;}
  .card{max-width:760px;width:100%;}
</style>
</head>
<body>
<div class="card">
<svg width="100%" viewBox="0 0 680 340" role="img">
<title>The logit link: probability to odds to log-odds</title>
<desc>A three stage diagram showing how a bounded probability between zero and one is transformed first into odds, an unbounded positive number, and then into log-odds, which spans the whole real line and equals the linear predictor. Below each stage, the effect of a coefficient is shown: not constant on the probability scale, a clean odds ratio on the odds scale, and a constant additive effect on the log-odds scale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="50" y="100" width="180" height="70" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="140" y="128" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">probability</text>
<text x="140" y="146" text-anchor="middle" font-size="11" fill="#993C1D">&#960; &#8712; [0, 1]</text>
<text x="140" y="162" text-anchor="middle" font-size="11" fill="#993C1D">bounded both sides</text>
<text x="280" y="115" text-anchor="middle" font-size="11" fill="#5F5E5A">take odds</text>
<line x1="230" y1="135" x2="330" y2="135" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="330" y="100" width="180" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="420" y="128" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">odds</text>
<text x="420" y="146" text-anchor="middle" font-size="11" fill="#5F5E5A">&#960;/(1&#8722;&#960;) &#8712; (0, &#8734;)</text>
<text x="420" y="162" text-anchor="middle" font-size="11" fill="#5F5E5A">bounded below only</text>
<text x="555" y="115" text-anchor="middle" font-size="11" fill="#5F5E5A">take log</text>
<line x1="510" y1="135" x2="600" y2="135" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470" y="200" width="160" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="550" y="228" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">log-odds</text>
<text x="550" y="246" text-anchor="middle" font-size="11" fill="#0F6E56">log(&#960;/(1&#8722;&#960;)) = x'&#946;</text>
<text x="550" y="262" text-anchor="middle" font-size="11" fill="#0F6E56">unbounded — this is linear</text>
<line x1="600" y1="170" x2="560" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="140" y="195" text-anchor="middle" font-size="11" fill="#712B13">effect of &#946;&#770;&#8267; NOT constant</text>
<text x="420" y="195" text-anchor="middle" font-size="11" fill="#444441">&#215;exp(&#946;&#770;&#8267;) &#8594; odds ratio</text>
<text x="550" y="290" text-anchor="middle" font-size="11" fill="#0F6E56">effect is exactly +&#946;&#770;&#8267;</text>
<text x="340" y="320" text-anchor="middle" font-size="11" fill="#5F5E5A">the linear predictor lives on the log-odds scale — that's why it's a GENERALISED linear model</text>
</svg>
</div>
</body>
</html>
