<svg viewBox="0 0 1000 625" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace">
  <style>
    .flow { stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
    .flow-slow { stroke-dasharray: 4 6; animation: dash 2.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .dim { animation: dim 3s ease-in-out infinite; }
    @keyframes dim { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="625" rx="12" fill="#020617"/>
  <rect x="0" y="0" width="1000" height="625" rx="12" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="998.5" height="623.5" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- header -->
  <circle cx="38" cy="33" r="4" fill="#34d399" class="pulse"/>
  <text x="52" y="37" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="3">SKRIPTRA · SYSTEM ARCHITECTURE</text>
  <text x="962" y="37" fill="#475569" font-size="9" text-anchor="end">docs/00-DESIGN.md</text>

  <!-- ═══ connections (drawn first, behind boxes) ═══ -->
  <!-- clients -> api -->
  <path d="M385,126 L385,185" fill="none" stroke="#22d3ee" stroke-width="1.5" class="flow" marker-end="url(#arrow)" opacity=".8"/>
  <path d="M615,126 L615,185" fill="none" stroke="#475569" stroke-width="1.2" class="flow-slow" marker-end="url(#arrow)" opacity=".5"/>
  <!-- api -> data plane -->
  <path d="M500,250 L500,285 L150,285 L150,319" fill="none" stroke="#a78bfa" stroke-width="1.5" class="flow" marker-end="url(#arrow)" opacity=".8"/>
  <path d="M500,250 L500,285 L370,285 L370,319" fill="none" stroke="#fb923c" stroke-width="1.5" class="flow" marker-end="url(#arrow)" opacity=".8"/>
  <path d="M500,250 L500,285 L600,285 L600,319" fill="none" stroke="#fbbf24" stroke-width="1.5" class="flow" marker-end="url(#arrow)" opacity=".8"/>
  <path d="M500,250 L500,285 L855,285 L855,319" fill="none" stroke="#94a3b8" stroke-width="1.5" class="flow" marker-end="url(#arrow)" opacity=".6"/>
  <!-- nats -> workers -->
  <path d="M370,384 L370,451" fill="none" stroke="#fb923c" stroke-width="1.5" class="flow" marker-end="url(#arrow)" opacity=".8"/>
  <!-- provider -> llm / embeddings -->
  <path d="M600,384 L600,418 L545,418 L545,451" fill="none" stroke="#fbbf24" stroke-width="1.5" class="flow" marker-end="url(#arrow)" opacity=".8"/>
  <path d="M600,384 L600,418 L665,418 L665,451" fill="none" stroke="#fbbf24" stroke-width="1.5" class="flow" marker-end="url(#arrow)" opacity=".8"/>
  <!-- workers -> postgres (write path) and workers -> embeddings -->
  <path d="M264,484 L150,484 L150,385" fill="none" stroke="#a78bfa" stroke-width="1.2" class="flow-slow" marker-end="url(#arrow)" opacity=".7"/>
  <path d="M370,517 L370,540 L665,540 L665,518" fill="none" stroke="#94a3b8" stroke-width="1.2" class="flow-slow" marker-end="url(#arrow)" opacity=".7"/>
  <text x="196" y="477" fill="#a78bfa" font-size="8" text-anchor="middle" opacity=".9">index</text>
  <text x="517" y="552" fill="#94a3b8" font-size="8" text-anchor="middle" opacity=".9">embed</text>

  <!-- data packets -->
  <circle r="3" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" path="M385,126 L385,183"/></circle>
  <circle r="3" fill="#a78bfa"><animateMotion dur="3.2s" repeatCount="indefinite" path="M500,250 L500,285 L150,285 L150,317"/></circle>
  <circle r="3" fill="#fbbf24"><animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite" path="M500,250 L500,285 L600,285 L600,317"/></circle>
  <circle r="3" fill="#fb923c"><animateMotion dur="2s" begin="0.4s" repeatCount="indefinite" path="M370,384 L370,449"/></circle>
  <circle r="3" fill="#a78bfa"><animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" path="M264,484 L150,484 L150,387"/></circle>

  <!-- ═══ clients ═══ -->
  <rect x="300" y="70" width="170" height="56" rx="6" fill="#0f172a"/>
  <rect x="300" y="70" width="170" height="56" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="385" y="94" fill="white" font-size="13" font-weight="600" text-anchor="middle">Web</text>
  <text x="385" y="112" fill="#94a3b8" font-size="10" text-anchor="middle">React + TypeScript</text>

  <rect x="530" y="70" width="170" height="56" rx="6" fill="#0f172a"/>
  <g class="dim">
    <rect x="530" y="70" width="170" height="56" rx="6" fill="rgba(8,51,68,0.25)" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="615" y="94" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">Flutter</text>
    <text x="615" y="112" fill="#64748b" font-size="10" text-anchor="middle">planned</text>
  </g>

  <!-- ═══ api ═══ -->
  <rect x="330" y="186" width="340" height="64" rx="6" fill="#0f172a"/>
  <rect x="330" y="186" width="340" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="213" fill="white" font-size="13" font-weight="600" text-anchor="middle">Go API</text>
  <text x="500" y="232" fill="#94a3b8" font-size="10" text-anchor="middle">/api/v1 · query router · SSE streaming</text>

  <!-- ═══ data plane ═══ -->
  <rect x="45" y="320" width="210" height="64" rx="6" fill="#0f172a"/>
  <rect x="45" y="320" width="210" height="64" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="347" fill="white" font-size="13" font-weight="600" text-anchor="middle">PostgreSQL</text>
  <text x="150" y="366" fill="#94a3b8" font-size="10" text-anchor="middle">pgvector · hybrid search</text>

  <rect x="295" y="320" width="150" height="64" rx="6" fill="#0f172a"/>
  <rect x="295" y="320" width="150" height="64" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="370" y="347" fill="white" font-size="13" font-weight="600" text-anchor="middle">NATS</text>
  <text x="370" y="366" fill="#94a3b8" font-size="10" text-anchor="middle">ingest queue</text>

  <rect x="485" y="320" width="230" height="64" rx="6" fill="#0f172a"/>
  <rect x="485" y="320" width="230" height="64" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="600" y="347" fill="white" font-size="13" font-weight="600" text-anchor="middle">AI Provider</text>
  <text x="600" y="366" fill="#94a3b8" font-size="10" text-anchor="middle">interface · chosen by config</text>

  <rect x="755" y="320" width="200" height="64" rx="6" fill="#0f172a"/>
  <rect x="755" y="320" width="200" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="855" y="347" fill="white" font-size="13" font-weight="600" text-anchor="middle">Redis</text>
  <text x="855" y="366" fill="#94a3b8" font-size="10" text-anchor="middle">cache</text>

  <!-- ═══ workers + models ═══ -->
  <rect x="265" y="452" width="210" height="64" rx="6" fill="#0f172a"/>
  <rect x="265" y="452" width="210" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="370" y="479" fill="white" font-size="13" font-weight="600" text-anchor="middle">Ingest workers</text>
  <text x="370" y="498" fill="#94a3b8" font-size="10" text-anchor="middle">PDF text + page map · go-fitz</text>

  <rect x="495" y="452" width="100" height="64" rx="6" fill="#0f172a"/>
  <rect x="495" y="452" width="100" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="545" y="479" fill="white" font-size="13" font-weight="600" text-anchor="middle">LLM</text>
  <text x="545" y="498" fill="#94a3b8" font-size="10" text-anchor="middle">local / hosted</text>

  <rect x="615" y="452" width="100" height="64" rx="6" fill="#0f172a"/>
  <rect x="615" y="452" width="100" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="665" y="479" fill="white" font-size="13" font-weight="600" text-anchor="middle">Embeddings</text>
  <text x="665" y="498" fill="#94a3b8" font-size="10" text-anchor="middle">local / hosted</text>

  <!-- ═══ legend ═══ -->
  <g font-size="10">
    <rect x="45" y="566" width="10" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="62" y="575" fill="#94a3b8">clients</text>
    <rect x="150" y="566" width="10" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="167" y="575" fill="#94a3b8">Go services</text>
    <rect x="290" y="566" width="10" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
    <text x="307" y="575" fill="#94a3b8">storage</text>
    <rect x="400" y="566" width="10" height="10" rx="2" fill="rgba(251,146,60,0.3)" stroke="#fb923c"/>
    <text x="417" y="575" fill="#94a3b8">messaging</text>
    <rect x="527" y="566" width="10" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
    <text x="544" y="575" fill="#94a3b8">AI interface</text>
    <rect x="662" y="566" width="10" height="10" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8"/>
    <text x="679" y="575" fill="#94a3b8">pluggable / cache</text>
  </g>
</svg>
